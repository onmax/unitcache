packages:
  - playgrounds/*
  - vendor/rolldown-stock

# Every `rolldown` in the stack resolves through vendor/rolldown, a symlink that
# scripts/use-rolldown.mjs points at the published 1.2.16 (vendor/rolldown-stock) or at a build of
# the fork (vendor/rolldown-fork).
overrides:
  rolldown: link:./vendor/rolldown
  rolldown-stock>rolldown: 1.2.16
  vite: 8.3.5
  nitro: 3.0.260903-beta
  nuxt: npm:nuxt-nightly@5.0.0-2610291341-744179a
  '@nuxt/kit': npm:@nuxt/kit-nightly@5.0.0-2610291341-744179a
  '@nuxt/schema': npm:@nuxt/schema-nightly@5.0.0-2610291341-744179a

# The changes Vite, plugin-vue, Nuxt and Nitro need, one patch per package. README.md lists each
# one; scripts/patches.mjs takes them out of node_modules for the "today" baseline and puts them back.
patchedDependencies:
  vite@8.3.5: patches/vite@8.3.5.patch
  '@vitejs/plugin-vue@6.0.10': patches/@vitejs__plugin-vue@6.0.10.patch
  '@nuxt/vite-builder-nightly@5.0.0-2610291341-744179a': patches/@nuxt__vite-builder-nightly@5.0.0-2610291341-744179a.patch
  nitro@3.0.260903-beta: patches/nitro@3.0.260903-beta.patch
  nuxt-og-image@7.0.7: patches/nuxt-og-image@7.0.7.patch

minimumReleaseAgeExclude:
  - '@nuxt/kit-nightly@5.0.0-2610291341-744179a'
  - '@nuxt/nitro-server-nightly@5.0.0-2610291341-744179a'
  - '@nuxt/schema-nightly@5.0.0-2610291341-744179a'
  - '@nuxt/vite-builder-nightly@5.0.0-2610291341-744179a'
  - '@nuxt/vite-server-nightly@5.0.0-2610291341-744179a'
  - nuxt-nightly@5.0.0-2610291341-744179a

allowBuilds:
  esbuild: false
  unrs-resolver: false
  vue-demi: false
